[project]
name = "live-stt"
version = "0.1.0"
description = "Live Japanese speech-to-text (local sherpa-onnx) with English translation via Codex"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0 WITH LLVM-exception"
license-files = ["LICENSE"]
authors = [
    { name = "Emir Turkes", email = "emir.turkes@eturkes.com" },
]
keywords = ["speech-to-text", "transcription", "japanese", "translation", "sherpa-onnx", "codex"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "sherpa-onnx>=1.13.2",
    "sherpa-onnx-core>=1.13.2",
]

[project.scripts]
live-stt = "live_stt:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["live_stt.py"]

[tool.hatch.build.targets.sdist]
include = ["live_stt.py", "README.md", ".agent/roadmap.md"]

[tool.pyright]
venvPath = "."
venv = ".venv"
# spike/ = historical research docs + the gitignored bench WAV corpus; the
# runnable harness was retired at T5 (D-014). Excluded from pyright analysis.
# Setting exclude REPLACES pyright's defaults — .venv/models/__pycache__ must
# be re-listed or pyright walks ~1 GB of weights and the venv tree.
exclude = ["spike", ".venv", "models", "**/__pycache__"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.pytest.ini_options]
testpaths = ["tests"]
