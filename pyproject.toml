[project]
name = "live-stt"
version = "0.1.0"
description = "Live Japanese speech-to-text (local Whisper on OpenVINO, sherpa-onnx fallback) with English translation via Codex"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0 WITH LLVM-exception"
license-files = ["LICENSE"]
authors = [
    { name = "Emir Turkes", email = "emir.turkes@eturkes.com" },
]
keywords = [
    "speech-to-text",
    "transcription",
    "japanese",
    "translation",
    "whisper",
    "openvino",
    "sherpa-onnx",
    "codex",
]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "sherpa-onnx>=1.13.4",
    "sherpa-onnx-core>=1.13.4",
    # Whisper is the DEFAULT engine, so these are hard dependencies: as an extra
    # they made `uv sync` produce a tool whose default `--engine whisper` raised
    # ModuleNotFoundError. The extra also bought nothing -- `uv sync --extra
    # whisper` downloaded 111,359,418 bytes against a hard-dependency `uv sync`
    # at 111,372,191 bytes. Deployment is these PyPI wheels, not the host
    # intel-accel archive an earlier comment here pointed at.
    # Wheel-only, cp311-cp314, for macOS arm64 / manylinux x86_64 + aarch64 /
    # Windows amd64, so those are the platforms this tool installs on at all.
    "openvino>=2026.3",
    "openvino-genai>=2026.3",
]

[project.scripts]
live-stt = "live_stt:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Both production modules: live_stt.py imports streaming, so a wheel without it
# installs cleanly and then fails at import (an editable install hides this).
only-include = ["live_stt.py", "streaming.py"]

[tool.hatch.build.targets.sdist]
# Leading slash anchors each pattern to the project root. Unanchored, a bare
# "README.md" matches at every depth and drags third-party copies out of any
# venv sitting in the tree, which makes the member list depend on local state.
include = [
    "/live_stt.py",
    "/streaming.py",
    "/README.md",
    "/models/README.md",
    "/.agent/roadmap.md",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
# spike/ = the gitignored bench WAV corpus only (D-014); the runnable harness
# and research docs were pruned (T5/D-014). Excluded from pyright analysis.
# Setting exclude REPLACES pyright's defaults — .venv/models/__pycache__ must
# be re-listed or pyright walks ~1 GB of weights and the venv tree.
exclude = ["spike", ".venv", ".venv-host", ".direnv", "models", "**/__pycache__"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.pytest.ini_options]
testpaths = ["tests"]
